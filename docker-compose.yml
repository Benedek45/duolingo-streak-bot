services:
  android:
    image: budtmo/docker-android:emulator_14.0
    container_name: duolingo-android
    privileged: true
    ports:
      - "6080:6080"   # noVNC web viewer (browser UI)
      - "5554:5554"   # emulator
      - "5555:5555"   # ADB
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
      - APPIUM=false
    volumes:
      - android-data:/root
      - ./apks:/root/apks   # drop APKs here to auto-install
    healthcheck:
      test: ["CMD", "cat", "/root/device_status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  # emulator takes ~2min to boot

volumes:
  android-data:  # persists installed apps + login state across restarts
